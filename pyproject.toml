[project]
name = "rag-engineering-workbench"
version = "0.1.0"
description = "A local-first, graph-native RAG engineering workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "pypdf>=5.0,<6",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
